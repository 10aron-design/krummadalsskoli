name: Build unsigned IPA

# Builds an UNSIGNED .ipa on a cloud Mac so Windows users can sideload it
# with Sideloadly (Sideloadly does the signing with your Apple ID).
#
# Run it: GitHub repo -> Actions tab -> "Build unsigned IPA" -> Run workflow.
# When it finishes, open the run -> Artifacts -> download "FlightDeals-ipa".

on:
  workflow_dispatch:        # manual button
  push:
    branches:
      - claude/modest-sagan-t3836u

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -project FlightDeals.xcodeproj \
            -scheme FlightDeals \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FlightDeals.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH"; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FlightDeals.ipa Payload >/dev/null
          ls -lh FlightDeals.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightDeals-ipa
          path: FlightDeals.ipa
          if-no-files-found: error
